<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>God Intervention</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #000;
  color: #fff;
  font-family: 'Inter', sans-serif;
}

/* NAV */
header {
  display: flex;
  justify-content: space-between;
  padding: 30px 60px;
  position: fixed;
  width: 100%;
  z-index: 10;
}

.logo {
  font-family: 'Playfair Display', serif;
  font-size: 20px;
  letter-spacing: 3px;
}

nav a {
  color: #aaa;
  margin-left: 30px;
  text-decoration: none;
  font-size: 13px;
  transition: 0.3s;
}

nav a:hover {
  color: #fff;
}

/* HERO */
.hero {
  height: 100vh;
  display: flex;
  align-items: center;
  padding: 0 10%;
}

.hero-text {
  max-width: 700px;
}

.hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: 80px;
  line-height: 1.1;
}

.hero p {
  margin-top: 20px;
  color: #aaa;
  font-size: 16px;
}

.hero button {
  margin-top: 30px;
  padding: 12px 30px;
  background: transparent;
  border: 1px solid #fff;
  color: #fff;
  cursor: pointer;
  transition: 0.3s;
}

.hero button:hover {
  background: #fff;
  color: #000;
}

/* SECTION */
.section {
  padding: 120px 10%;
}

.section-title {
  font-family: 'Playfair Display', serif;
  font-size: 40px;
  margin-bottom: 60px;
}

/* PRODUCTS */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 40px;
}

.card {
  position: relative;
  overflow: hidden;
}

.card img {
  width: 100%;
  transition: 0.6s ease;
}

.card:hover img {
  transform: scale(1.05);
  opacity: 0.7;
}

.card-info {
  margin-top: 15px;
}

.card-info h4 {
  font-weight: 500;
}

.card-info span {
  color: #777;
  font-size: 14px;
}

/* LOOKBOOK STYLE BREAK */
.statement {
  text-align: center;
  font-family: 'Playfair Display', serif;
  font-size: 48px;
  padding: 150px 10%;
  line-height: 1.3;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 40px;
  color: #777;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <div class="logo">GOD INTERVENTION</div>
  <nav>
    <a href="#">Shop</a>
    <a href="#">Lookbook</a>
    <a href="#">About</a>
  </nav>
</header>

<section class="hero">
  <div class="hero-text">
    <h1>Divine Energy<br>In Motion</h1>
    <p>Not just clothing. A message.</p>
    <button>Shop Collection</button>
  </div>
</section>

<section class="section">
  <h2 class="section-title">Latest Drop</h2>

  <div class="grid">
    <div class="card">
      <img src="https://via.placeholder.com/400x500">
      <div class="card-info">
        <h4>Divine Hoodie</h4>
        <span>$65</span>
      </div>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/400x500">
      <div class="card-info">
        <h4>Intervention Tee</h4>
        <span>$35</span>
      </div>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/400x500">
      <div class="card-info">
        <h4>Faith Cap</h4>
        <span>$25</span>
      </div>
    </div>
  </div>
</section>

<section class="statement">
  “When the world moves one way,<br>we move with purpose.”
</section>

<footer>
  © 2026 God Intervention
</footer>

</body>
</html>
