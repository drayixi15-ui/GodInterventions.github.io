<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>God Intervention</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  background:black;
  color:white;
  font-family: 'Inter', sans-serif;
}

header {
  display:flex;
  justify-content:space-between;
  padding:30px;
}

.logo {
  font-family:'Playfair Display', serif;
  letter-spacing:3px;
}

.hero {
  height:90vh;
  display:flex;
  align-items:center;
  padding:0 10%;
}

.hero h1 {
  font-size:70px;
}

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:40px;
  padding:80px 10%;
}

.card img {
  width:100%;
}

button {
  margin-top:10px;
  padding:10px;
  width:100%;
  background:white;
  color:black;
  border:none;
  cursor:pointer;
}
</style>
</head>

<body>

<header>
  <div class="logo">GOD INTERVENTION</div>
</header>

<section class="hero">
  <h1>Divine Energy In Motion</h1>
</section>

<section class="grid">

  <div class="card">
    <img src="https://via.placeholder.com/400x500">
    <h3>Divine Hoodie</h3>
    <p>$65</p>

    <!-- SHOPIFY BUY BUTTON -->
    <a href="https://YOUR-STORE.myshopify.com/cart/VARIANT_ID:1">
      <button>Buy Now</button>
    </a>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/400x500">
    <h3>God Intervention T-Shirt</h3>
    <p>$25</p>

    <a href="0bsezd-ky.myshopify.com/cart/51824217424004:1">
      <button>Buy Now</button>
    </a>
  </div>

</section>

</body>
</html>
