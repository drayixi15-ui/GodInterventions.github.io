<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>God Intervention</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #000;
      color: #fff;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      border-bottom: 1px solid #333;
    }

    header h1 {
      font-size: 24px;
      letter-spacing: 2px;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      margin-left: 20px;
      font-size: 14px;
    }

    .hero {
      height: 90vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: url('https://images.unsplash.com/photo-1520975916090-3105956dac38') no-repeat center/cover;
    }

    .hero h2 {
      font-size: 48px;
      background-color: rgba(0,0,0,0.6);
      padding: 20px;
    }

    .products {
      padding: 60px 40px;
      text-align: center;
    }

    .products h3 {
      margin-bottom: 40px;
      font-size: 28px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .product {
      background: #111;
      padding: 20px;
    }

    .product img {
      width: 100%;
    }

    .product h4 {
      margin: 10px 0;
    }

    footer {
      padding: 30px;
      text-align: center;
      border-top: 1px solid #333;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <h1>GOD INTERVENTION</h1>
  <nav>
    <a href="#">Home</a>
    <a href="#">Shop</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>
</header>

<section class="hero">
  <h2>Faith. Power. Purpose.</h2>
</section>

<section class="products">
  <h3>Featured Drops</h3>

  <div class="product-grid">
    <div class="product">
      <img src="https://via.placeholder.com/300x400" alt="Hoodie">
      <h4>Divine Hoodie</h4>
      <p>$65</p>
    </div>

    <div class="product">
      <img src="https://via.placeholder.com/300x400" alt="T-Shirt">
      <h4>Intervention Tee</h4>
      <p>$35</p>
    </div>

    <div class="product">
      <img src="https://via.placeholder.com/300x400" alt="Hat">
      <h4>Faith Cap</h4>
      <p>$25</p>
    </div>
  </div>
</section>

<footer>
  <p>© 2026 God Intervention. All rights reserved.</p>
</footer>

</body>
</html>
